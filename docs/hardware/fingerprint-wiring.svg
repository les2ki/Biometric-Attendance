<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="720" viewBox="0 0 1130 720" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
