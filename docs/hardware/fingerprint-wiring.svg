<text x="812" y="379" font-size="12">RX (in)</text>
<circle cx="800" cy="403" r="5" fill="#16a34a"/>
<text x="812" y="407" font-size="12">TX (out)</text>
<circle cx="800" cy="431" r="5" fill="#111827"/>
<text x="812" y="435" font-size="12">GND</text>
<circle cx="800" cy="459" r="5" fill="#dc2626"/>
<text x="812" y="463" font-size="12">VCC (3.6–6 V)</text>
<path d="M530,380 H720 V375 H800" fill="none" stroke="#2563eb" stroke-width="3"/>
<text x="540" y="373" font-size="11" fill="#2563eb">GPIO17 → sensor RX</text>
<path d="M530,410 H700 V403 H800" fill="none" stroke="#16a34a" stroke-width="3"/>
<text x="540" y="403" font-size="11" fill="#16a34a">GPIO16 ← sensor TX</text>
<path d="M530,530 H680 V431 H800" fill="none" stroke="#111827" stroke-width="3"/>
<text x="540" y="523" font-size="11" fill="#111827">GND → sensor GND</text>
<path d="M330,560 H290 V620 H760 V459 H800" fill="none" stroke="#dc2626" stroke-width="3"/>
<text x="420" y="614" font-size="11" fill="#dc2626">VIN (5 V from USB) → sensor VCC</text>
<rect x="790" y="540" width="320" height="150" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
<text x="805" y="560" font-size="13" font-weight="700">Legend &amp; notes</text>
<circle cx="812" cy="582" r="5" fill="#16a34a"/>
<text x="825" y="586" font-size="11">Used now (fingerprint)</text>
<circle cx="812" cy="602" r="5" fill="#f59e0b"/>
<text x="825" y="606" font-size="11">Reserved for later stages</text>
<circle cx="812" cy="622" r="5" fill="#9ca3af"/>
<text x="825" y="626" font-size="11">Free — avoid D0, D2, D12, D15 (boot pins)</text>
<text x="805" y="650" font-size="11" fill="#444">• TX↔RX cross over: sensor TX → ESP32 RX.</text>
<text x="805" y="666" font-size="11" fill="#444">• Wire colours vary by batch — trust the PCB labels.</text>
<text x="805" y="682" font-size="11" fill="#444">• Sensor TX must idle at 3.3 V (measure it first).</text>
